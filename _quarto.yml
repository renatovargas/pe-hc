project:
  type: website
  output-dir: docs
  execute-dir: project
  render:
    - "*.qmd"
    - "materiales/**/*.qmd"
    - "slides/**/*.qmd"
    - "!refs/"
    # Páginas de presentaciones aún no publicadas; quitar la exclusión al activarlas
    # - "!materiales/presentaciones/01-*.qmd"
    # - "!materiales/presentaciones/02-*.qmd"
    # - "!materiales/presentaciones/03-*.qmd"
    # - "!materiales/presentaciones/04-*.qmd"
  resources:
    - datos/
    - assets/

website:
  title: "Perú HC"
  repo-url: https://github.com/renatovargas/pe-hc
  repo-branch: main
  repo-actions: [source]
  description: "Implementación de Huellas de Carbono por parte del INEI de Perú"
  navbar:
    left:
      - href: index.qmd
        text: Home
      - href: materiales/index.qmd
        text: Materiales
      - href: about.qmd
        text: Acerca de
  sidebar:
    - title: Materiales
      style: docked
      search: false
      contents:
        - text: "Materiales"
          href: materiales/index.qmd
        - section: Documentos
          contents:
            - text: "Contexto de la misión"
              href: materiales/documentos/contexto-asistencia-tecnica/index.qmd
            - text: "Huellas de carbono"
              href: materiales/documentos/contexto-huella-de-carbono-peru/index.qmd
        - section: Presentaciones
          contents:
            - materiales/presentaciones/00-contexto-huella-de-carbono.qmd
            - materiales/presentaciones/00b-intro-cou-formato-plano.qmd
            - materiales/presentaciones/01-intro-algebra.qmd
            - materiales/presentaciones/02-modelo-insumo-producto.qmd
            - materiales/presentaciones/03-extension-ambiental.qmd
            - materiales/presentaciones/04-matrices-rectangulares.qmd

format:
  html:
    theme:
      - yeti
      - styles.scss
      # - brand
    css: styles.css
    toc: true
